version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Vancouver"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      python-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:45"
      timezone: "America/Vancouver"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions-non-major:
        patterns: ["*"]
        update-types: ["minor", "patch"]
