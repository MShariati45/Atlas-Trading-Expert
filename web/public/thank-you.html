<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">

  <title>Thank You | Atlas Trading Expert</title>

  <link rel="stylesheet" href="/thank-you.css">
</head>

<body>

  <main class="thankyou-page">

    <div class="content-mask" aria-hidden="true"></div>

    <section
      class="thankyou-content"
      aria-labelledby="thankyouTitle"
    >

      <h1 id="thankyouTitle">
        Thank You for Your Request
      </h1>

      <p class="message">
        We have successfully received your information.<br>
        A member of the Atlas Trading Expert team will review your request
        and get in touch with you shortly.
      </p>

      <div
        class="reference"
        id="leadReference"
      >
        Request Reference:
        <strong id="leadReferenceValue"></strong>
      </div>

      <a
        class="home-btn"
        href="/"
      >
        <span class="home-icon">&#8962;</span>
        RETURN TO HOME
      </a>

    </section>

  </main>

  <script src="/thank-you.js"></script>

</body>
</html>
